# Builds and packages every WarpDrop client:
#   Windows (.msi + NSIS .exe) and Linux (.deb + .AppImage) — Tauri desktop app
#   macOS (.dmg)                                            — native Swift app
#   Android (.apk)                                          — Kotlin/Compose app
# Pushing a tag `v*` also publishes a GitHub Release with all artifacts.
#
# Optional secrets (each platform builds unsigned without them):
#   macOS:   MACOS_CERTIFICATE_P12 (base64), MACOS_CERTIFICATE_PASSWORD,
#            MACOS_SIGNING_IDENTITY ("Developer ID Application: …"),
#            APPLE_ID, APPLE_APP_PASSWORD, APPLE_TEAM_ID   (notarization),
#            MACOS_PROVISIONING_PROFILE (base64 Developer ID profile; needed
#            for iCloud key-value sync + shared keychain — without it the app
#            is signed with those restricted entitlements removed)
#   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   Android: ANDROID_KEYSTORE (base64 .jks), ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  core-tests:
    name: Core tests (Rust)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --locked -p libwarp -p warp-signal -p warp-cli --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked -p libwarp -p warp-signal

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            bundles: msi,nsis
          - name: Linux
            os: ubuntu-22.04 # oldest supported glibc for the .deb/.AppImage
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
            node -e "const f='desktop/src-tauri/tauri.conf.json',c=require('./'+f);c.version='$V';require('fs').writeFileSync(f,JSON.stringify(c,null,2)+'\n')"
          fi
      - name: Windows code-signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          # Tauri signs the .exe/.msi when bundle.windows.certificateThumbprint is set.
          $conf = "desktop/src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.bundle.windows | Add-Member -Force certificateThumbprint $cert.Thumbprint
          $json.bundle.windows | Add-Member -Force digestAlgorithm "sha256"
          $json.bundle.windows | Add-Member -Force timestampUrl "http://timestamp.digicert.com"
          $json | ConvertTo-Json -Depth 20 | Set-Content $conf
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # linuxdeploy without FUSE on CI
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }}
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          B=target/release/bundle
          find "$B" -maxdepth 2 -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.deb' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          ls -la dist
          test -n "$(ls dist)"
      - uses: actions/upload-artifact@v4
        with:
          name: warpdrop-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    needs: core-tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos
      - name: Rust core → XCFramework + Swift bindings (macOS slice)
        env:
          MACOS_ONLY: "1"
        run: ./scripts/build-apple.sh
      - name: Generate Xcode project for this Xcode version
        run: |
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Version from tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"; else echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"; fi
      - name: Build WarpDrop.app (Release, universal)
        run: |
          xcodebuild -project apple/WarpDrop.xcodeproj -scheme WarpDrop-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/dd \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO build
          cp -R build/dd/Build/Products/Release/WarpDrop.app "$RUNNER_TEMP/WarpDrop.app"
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "SIGN=1" >> "$GITHUB_ENV"
      - name: Sign (hardened runtime)
        if: env.SIGN == '1'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          APP="$RUNNER_TEMP/WarpDrop.app"
          APPX="$APP/Contents/PlugIns/WarpDropShare.appex"
          cp apple/macOS/WarpDrop.entitlements "$RUNNER_TEMP/app.entitlements"
          cp apple/ShareExtension/macOS/WarpDropShare.entitlements "$RUNNER_TEMP/share.entitlements"
          if [ -n "$PROFILE" ]; then
            echo "$PROFILE" | base64 --decode > "$APP/Contents/embedded.provisionprofile"
          else
            # iCloud KVS and keychain-access-groups are restricted entitlements:
            # a Developer ID build that claims them without a profile won't launch.
            for f in "$RUNNER_TEMP/app.entitlements" "$RUNNER_TEMP/share.entitlements"; do
              /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.ubiquity-kvstore-identifier" "$f" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Delete :keychain-access-groups" "$f" 2>/dev/null || true
            done
          fi
          # $(TeamIdentifierPrefix) placeholders → real team id.
          sed -i '' "s/\$(TeamIdentifierPrefix)/${{ secrets.APPLE_TEAM_ID }}./g; s/\$(AppIdentifierPrefix)/${{ secrets.APPLE_TEAM_ID }}./g" \
            "$RUNNER_TEMP/app.entitlements" "$RUNNER_TEMP/share.entitlements"
          # Inside-out: extension first, then the app.
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/share.entitlements" "$APPX"
          codesign --force --options runtime --timestamp --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/app.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
      - name: Create .dmg
        run: |
          mkdir -p dmgroot dist
          cp -R "$RUNNER_TEMP/WarpDrop.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname WarpDrop -srcfolder dmgroot -ov -format UDZO "dist/WarpDrop-$VERSION-macOS.dmg"
      - name: Notarize
        if: env.SIGN == '1' && env.APPLE_ID != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          DMG="dist/WarpDrop-$VERSION-macOS.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$DMG"
      - uses: actions/upload-artifact@v4
        with:
          name: warpdrop-macOS
          path: dist/*.dmg
          if-no-files-found: error

  android:
    name: Android (.apk)
    needs: core-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # The Ubuntu runner ships the Android SDK; use its sdkmanager directly
      # (android-actions/setup-android fails on newer cmdline-tools).
      - name: SDK packages (platform 37, NDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" | tail -2
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Rust core → libwarp.so + Kotlin bindings
        run: ./scripts/build-android.sh
      - name: Release keystore
        if: env.ANDROID_KEYSTORE != ''
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "WARPDROP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build APK
        working-directory: android
        env:
          WARPDROP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WARPDROP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WARPDROP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WARPDROP_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export WARPDROP_VERSION="${GITHUB_REF#refs/tags/v}"; fi
          mkdir -p ../dist
          if [ -n "${WARPDROP_KEYSTORE_FILE:-}" ]; then
            ./gradlew --no-daemon :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "../dist/WarpDrop-${WARPDROP_VERSION:-dev}-android.apk"
          else
            echo "::warning::No ANDROID_KEYSTORE secret — publishing the debug-signed APK"
            ./gradlew --no-daemon :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "../dist/WarpDrop-${WARPDROP_VERSION:-dev}-android-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: warpdrop-Android
          path: dist/*.apk
          if-no-files-found: error

  relay:
    name: warp-signal (Linux x86_64)
    needs: core-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: relay
      - run: |
          cargo build --release -p warp-signal -p warp-cli
          mkdir -p dist
          tar -C target/release -czf dist/warp-signal-linux-x86_64.tar.gz warp-signal warp
      - uses: actions/upload-artifact@v4
        with:
          name: warpdrop-relay
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, macos, android, relay]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
