[package]
name = "libwarp"
description = "WarpDrop core: discovery, PAKE + mTLS QUIC transport, streaming folder transfer engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "warp"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
rand.workspace = true
uniffi.workspace = true

quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rcgen = { version = "0.13", default-features = false, features = ["ring"] }
ring = "0.17"
x509-parser = "0.16"
spake2 = "0.4"
blake3 = "1.8"
argon2 = "0.5"
zstd = "0.13"
postcard = { version = "1", features = ["use-std"] }
socket2 = { version = "0.5", features = ["all"] }
if-addrs = "0.13"
mdns-sd = "0.13"
walkdir = "2"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"
parking_lot = "0.12"
qrcode = { version = "0.14", default-features = false }
libc = "0.2"

[dev-dependencies]
warp-signal = { path = "../../rendezvous-relay" }
tempfile = "3"
tracing-subscriber.workspace = true
